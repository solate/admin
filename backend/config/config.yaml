# 默认配置文件
app:
  name: "Admin"
  env: "dev"


log:
  level: debug
  format: text
  add_source: true


server:
  port: 8080
  mode: debug
  read_timeout: 10s       # 读超时
  write_timeout: 10s      # 写超时
  idle_timeout: 60s       # keep-alive 空闲超时
  graceful_timeout: 30s   # 优雅关闭超时（支持 s/m/h）
  cors:
    allowed_origins: ["http://localhost:5173"]  # 生产环境改为真实域名

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: admin_dev
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 0             # 连接池大小，0 用 go-redis 默认(10*CPU)
  min_idle_conns: 0        # 最小空闲连接，0 用默认
  max_retries: 0           # 命令重试次数，0 用默认(3)
  dial_timeout: 0          # 建连超时(秒)，0 用默认(5)
  read_timeout: 0          # 读超时(秒)，0 用默认(3)
  write_timeout: 0         # 写超时(秒)，0 用默认(=read_timeout)

jwt:
  access_secret: "your-access-secret-change-in-production"
  refresh_secret: "your-refresh-secret-change-in-production"
  access_ttl: 30
  refresh_ttl: 10080
  issuer: "admin"

